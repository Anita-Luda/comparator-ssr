<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparator SSR</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Comparator SSR</h1>
        <p class="subtitle">Porównaj DOM (Browser) z HTML (Server)</p>
    </header>

    <main>
        <div class="controls">
            <button id="extract" class="btn-primary">Porównaj teraz</button>
            <div class="options">
                <button id="copyDevtools" class="btn-secondary" disabled>Kopiuj DevTools</button>
                <button id="copySource" class="btn-secondary" disabled>Kopiuj Source</button>
            </div>
        </div>

        <div id="loading" class="spinner-container" style="display: none;">
            <div class="spinner"></div>
            <p>Pobieranie i analizowanie danych... (może to zająć do 5s)</p>
        </div>

        <div id="comparisonResult" style="display: none;">
            <section class="result-section">
                <h2>Wynik porównania</h2>
                <div class="legend">
                    <span class="legend-item mismatch">Różnica</span>
                    <span class="legend-item match">Zgodność</span>
                </div>
                <div id="comparisonOutput"></div>
            </section>

            <section class="code-container">
                <div class="code-section">
                    <h2>Kod DevTools (DOM)</h2>
                    <pre id="devtoolsCode"></pre>
                </div>
                <div class="code-section">
                    <h2>Kod Source (Server)</h2>
                    <pre id="sourceCode"></pre>
                </div>
            </section>
        </div>
    </main>

    <script src="popup.js"></script>
</body>

</html>
